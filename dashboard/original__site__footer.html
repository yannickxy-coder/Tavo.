 <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.23/bundled/lenis.min.js"></script> 
<script>
document.addEventListener("DOMContentLoaded", function () {
  // === Abbruch, falls Seite die Funktionen deaktiviert ===
  if (window.disableLenis) {
    console.log("Lenis deaktiviert auf dieser Seite.");
  } else {
    // LENIS SMOOTH SCROLL
    let lenis;
    if (Webflow.env("editor") === undefined) {
      lenis = new Lenis({
        lerp: 0.1,
        wheelMultiplier: 0.7,
        gestureOrientation: "vertical",
        normalizeWheel: false,
        smoothTouch: false
      });
      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);
    }
    $("[data-lenis-start]").on("click", function () {
      lenis.start();
    });
    $("[data-lenis-stop]").on("click", function () {
      lenis.stop();
    });
    $("[data-lenis-toggle]").on("click", function () {
      $(this).toggleClass("stop-scroll");
      if ($(this).hasClass("stop-scroll")) {
        lenis.stop();
      } else {
        lenis.start();
      }
    });
  }

  // === PRELOADER ===
  if (window.disablePreloader) {
    console.log("Preloader deaktiviert auf dieser Seite.");
    const preloader = document.querySelector(".preloader");
    if (preloader) {
      preloader.style.display = "none";
      preloader.style.visibility = "hidden";
    }
    return;
  }

  const preloader = document.querySelector(".preloader");
  const lastShown = localStorage.getItem("preloaderLastShown");
  const now = new Date().getTime();
  const oneDay = 24 * 60 * 60 * 1000;

  if (preloader) {
    if (!lastShown || now - parseInt(lastShown, 10) > oneDay) {
      preloader.style.display = "block";
      preloader.style.visibility = "visible";
      localStorage.setItem("preloaderLastShown", now.toString());
      setTimeout(() => {
        preloader.style.display = "none";
      }, 5000);
    } else {
      preloader.style.display = "none";
      preloader.style.visibility = "hidden";
    }
  }
});
</script>
