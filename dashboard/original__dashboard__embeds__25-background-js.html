<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>

<style>
  /* ============================================================
     TABLEFY DASHBOARD BACKGROUND

     Ein linearer Verlauf von Farbe 1 ueber Farbe 2 zu Farbe 3,
     danach Ausblendung auf die Grundflaeche.

     Kein filter: blur() mehr. Ein Weichzeichner ueber eine Flaeche
     dieser Groesse wird nicht einmalig gerechnet, sondern jedes Mal
     neu, wenn darueber etwas neu zusammengesetzt wird -- also bei
     jedem Frame von Slider und Moving Pill.
     ============================================================ */

  [data-tablefy-dashboard-bg] {
    --tf-bg-base: #e2e8ef;

    position: fixed;
    inset: 0;
    z-index: 0;

    overflow: hidden;
    pointer-events: none;

    background: var(--tf-bg-base);

    /* Eigener Stapelkontext: der Hintergrund wird nicht Teil der
       Compositing-Kette dessen, was darueber animiert. */
    isolation: isolate;
  }

  [data-tablefy-dashboard-content] {
    position: relative;
    z-index: 1;
  }

  .tf-bg-gradient {
    position: absolute;
    inset: 0;
    transform: translateZ(0);
  }

  /* Scroll-Farbebene zwischen Verlauf und unterer Ausblendung. */
  .tf-bg-scroll-color {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  .tf-bg-fade {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: linear-gradient(
      180deg,
      rgba(226, 232, 239, 0) 0%,
      rgba(226, 232, 239, 0) 56%,
      rgba(226, 232, 239, 0.06) 64%,
      rgba(226, 232, 239, 0.16) 72%,
      rgba(226, 232, 239, 0.34) 80%,
      rgba(226, 232, 239, 0.6) 89%,
      rgba(226, 232, 239, 0.82) 96%,
      #e2e8ef 100%
    );
    pointer-events: none;
  }

  /* ============================================================
     BEWEGTE ELEMENTE AUF EIGENE EBENE
     Ohne eigene Ebene ziehen Slider und Pill bei jedem Frame
     alles darunter in ihren Repaint -- inklusive Hintergrund.
     ============================================================ */

  [data-tabs-track],
  [data-tabs-nav-pill],
  [data-slideshow="slide"],
  [data-toggle-init]::before,
  [data-tavo-area-list]::before,
  [data-sheet] {
    transform: translateZ(0);
  }

  [data-tabs-track],
  [data-tabs-nav-pill] {
    will-change: transform;
  }

  @media (max-width: 767px) {
    .tf-bg-fade {
      background: linear-gradient(
        180deg,
        rgba(226, 232, 239, 0) 0%,
        rgba(226, 232, 239, 0) 52%,
        rgba(226, 232, 239, 0.07) 62%,
        rgba(226, 232, 239, 0.18) 71%,
        rgba(226, 232, 239, 0.38) 80%,
        rgba(226, 232, 239, 0.66) 90%,
        #e2e8ef 100%
      );
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-tabs-track],
    [data-tabs-nav-pill] { will-change: auto; }
  }
</style>

<script>
  (function () {
    'use strict';

    const SUPABASE_URL = 'https://wiwhbszwkuekxkdiqcgd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XMcYwAIjE67De0Dy2V5g7Q_Agp5l-Zd';

    const root = document.querySelector('[data-tablefy-dashboard-bg]');
    if (!root) return;

    /* Vorhandenen Client mitbenutzen, falls das Dashboard schon einen
       angelegt hat -- sonst zwei Auth-Listener und doppelte Session. */
    const sb =
      window.tavoDB ||
      window.tavoSupabase ||
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });

    const FALLBACK = {
      enabled: true,
      color1: '#0C2A4A',
      color2: '#607F9F',
      color3: '#A5B7C8',
    };

    let currentRestaurantId = null;
    let memberships = [];
    let requestToken = 0;

    /* ---------- DOM ---------- */

    const gradient = document.createElement('div');
    gradient.className = 'tf-bg-gradient';

    const fade = document.createElement('div');
    fade.className = 'tf-bg-fade';

    const scrollColor = document.createElement('div');
    scrollColor.className = 'tf-bg-scroll-color';
    scrollColor.setAttribute('aria-hidden', 'true');

    root.append(gradient, scrollColor, fade);

    /* Optional am Hintergrund:
       data-tablefy-bg-scroll-distance="400"  Strecke in Pixeln
       data-tablefy-bg-scroll-target=".mein-scroll-container"
       Ohne Ziel-Selektor wird das Scrollen der Seite verwendet. */
    let scrollTarget = window;
    const scrollSelector = root.getAttribute('data-tablefy-bg-scroll-target');
    if (scrollSelector) {
      try {
        const target = document.querySelector(scrollSelector);
        if (target) scrollTarget = target;
        else console.warn('[Tablefy Background] Scroll-Container nicht gefunden:', scrollSelector);
      } catch (e) {
        console.warn('[Tablefy Background] Ungueltiger Scroll-Selektor:', scrollSelector);
      }
    }

    let scrollFrame = 0;
    function updateScrollColor() {
      scrollFrame = 0;
      const configured = Number(root.getAttribute('data-tablefy-bg-scroll-distance'));
      const distance = Number.isFinite(configured) && configured > 0 ? configured : 400;
      const pageScroll = document.scrollingElement || document.documentElement;
      const y = scrollTarget === window || scrollTarget === pageScroll
        ? pageScroll.scrollTop
        : scrollTarget.scrollTop;
      scrollColor.style.opacity = String(Math.max(0, Math.min(1, y / distance)));
    }

    function scheduleScrollColor() {
      if (!scrollFrame) scrollFrame = requestAnimationFrame(updateScrollColor);
    }

    const scrollEvents = scrollTarget === document.scrollingElement ? window : scrollTarget;
    scrollEvents.addEventListener('scroll', scheduleScrollColor, { passive: true });
    window.addEventListener('resize', scheduleScrollColor, { passive: true });
    window.addEventListener('pageshow', scheduleScrollColor);
    updateScrollColor();

    /* ---------- Farbhelfer ---------- */

    function validHex(value) {
      return typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value);
    }

    function hexToRgb(hex) {
      const v = hex.replace('#', '');
      return {
        r: parseInt(v.slice(0, 2), 16),
        g: parseInt(v.slice(2, 4), 16),
        b: parseInt(v.slice(4, 6), 16),
      };
    }

    function rgbToHex(rgb) {
      const c = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
      return '#' + c(rgb.r) + c(rgb.g) + c(rgb.b);
    }

    function mix(colorA, colorB, amount) {
      const a = hexToRgb(colorA);
      const b = hexToRgb(colorB);
      return rgbToHex({
        r: a.r + (b.r - a.r) * amount,
        g: a.g + (b.g - a.g) * amount,
        b: a.b + (b.b - a.b) * amount,
      });
    }

    function rgba(hex, alpha) {
      const c = hexToRgb(hex);
      return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
    }

    function normalizeTheme(data) {
      return {
        enabled: data?.ambient_background_enabled !== false,
        color1: validHex(data?.ambient_color_1) ? data.ambient_color_1 : FALLBACK.color1,
        color2: validHex(data?.ambient_color_2) ? data.ambient_color_2 : FALLBACK.color2,
        color3: validHex(data?.ambient_color_3) ? data.ambient_color_3 : null,
      };
    }

    /* ---------- Rendern ---------- */

    function renderTheme(theme) {
      root.style.display = theme.enabled ? '' : 'none';
      if (!theme.enabled) return;

      const color1 = theme.color1;
      const color2 = theme.color2;

      // Fuer die Scroll-Flaeche nur die echte dritte Farbe verwenden.
      scrollColor.style.backgroundColor = theme.color3 || color2;
      updateScrollColor();

      /* Exakte Stops: mit Farbe 3 bei 0/50/100 Prozent,
         ansonsten Farbe 1 bei 0 und Farbe 2 bei 100 Prozent. */
      gradient.style.background = theme.color3
        ? 'linear-gradient(180deg, ' + color1 + ' 0%, ' + color2 + ' 50%, ' + theme.color3 + ' 100%)'
        : 'linear-gradient(180deg, ' + color1 + ' 0%, ' + color2 + ' 100%)';
    }

    /* ---------- Daten ---------- */

    async function loadRestaurant(restaurantId) {
      if (!restaurantId) return;
      if (restaurantId === currentRestaurantId) return;

      const token = ++requestToken;

      const { data, error } = await sb
        .from('restaurants')
        .select('id, name, slug, ambient_background_enabled, ambient_color_1, ambient_color_2, ambient_color_3')
        .eq('id', restaurantId)
        .maybeSingle();

      if (token !== requestToken) return;   // zwischenzeitlich gewechselt

      if (error || !data) {
        console.warn('[Tablefy Background]', error);
        renderTheme(FALLBACK);
        return;
      }

      currentRestaurantId = data.id;
      renderTheme(normalizeTheme(data));

      window.dispatchEvent(new CustomEvent('tablefy:background-changed', {
        detail: { restaurant: data },
      }));
    }

    /* Woher das aktive Restaurant kommt -- in dieser Reihenfolge:

       1. data-active-restaurant-id am <html> oder <body>
       2. [data-res-restaurant] -- das Dashboard schreibt die aktive
          Restaurant-ID ohnehin dorthin. Genau hier lag der Fehler:
          Bei mehreren Mitgliedschaften suchte das Skript nur nach 1.,
          fand nichts und zeigte die neutrale Fallback-CI. Deshalb sah
          Villa Weil aus wie die Strassenmuehle.
       3. Gespeicherte Wahl aus der letzten Sitzung.
       4. Nur eine Mitgliedschaft? Dann ist die Sache klar. */
    function getActiveRestaurantId() {
      const vomAttribut =
        document.documentElement.getAttribute('data-active-restaurant-id') ||
        document.body?.getAttribute('data-active-restaurant-id');
      if (vomAttribut) return vomAttribut;

      const vomDashboard = document.querySelector('[data-res-restaurant]');
      if (vomDashboard) {
        const id = vomDashboard.getAttribute('data-res-restaurant');
        if (id) return id;
      }

      try {
        const gemerkt = localStorage.getItem('tavo:aktives-restaurant');
        if (gemerkt) return gemerkt;
      } catch (e) { /* Speicher gesperrt -- egal */ }

      return null;
    }

    function userHasRestaurant(restaurantId) {
      return memberships.some((m) => m.restaurant_id === restaurantId);
    }

    async function resolveUserRestaurants() {
      const { data: { user }, error: userError } = await sb.auth.getUser();

      if (userError || !user) {
        renderTheme(FALLBACK);
        return;
      }

      const { data, error } = await sb
        .from('memberships')
        .select('restaurant_id, role')
        .eq('user_id', user.id);

      if (error) {
        console.warn('[Tablefy Background]', error);
        renderTheme(FALLBACK);
        return;
      }

      memberships = data || [];
      if (memberships.length === 0) { renderTheme(FALLBACK); return; }

      const aktiv = getActiveRestaurantId();
      if (aktiv && userHasRestaurant(aktiv)) { await loadRestaurant(aktiv); return; }

      if (memberships.length === 1) { await loadRestaurant(memberships[0].restaurant_id); return; }

      /* Mehrere Mitgliedschaften und keine Angabe, welche gilt:
         weiter beobachten, statt willkuerlich eine zu waehlen. */
      renderTheme(FALLBACK);
      beobachteDashboard();
    }

    /* Das Dashboard schreibt [data-res-restaurant] erst, wenn der
       Hydrator gelaufen ist -- der Hintergrund startet frueher.
       Deshalb nachfassen, bis der Wert steht. */
    let beobachtet = false;
    function beobachteDashboard() {
      if (beobachtet) return;
      beobachtet = true;

      let versuche = 0;
      const timer = setInterval(function () {
        const id = getActiveRestaurantId();
        if (id && userHasRestaurant(id)) {
          clearInterval(timer);
          loadRestaurant(id);
          return;
        }
        if (++versuche > 40) clearInterval(timer);   // 10 s
      }, 250);
    }

    async function setActiveRestaurant(restaurantId) {
      if (!restaurantId) return;
      if (memberships.length === 0) await resolveUserRestaurants();
      if (!userHasRestaurant(restaurantId)) {
        console.warn('[Tablefy Background] Kein Zugriff:', restaurantId);
        return;
      }

      document.documentElement.setAttribute('data-active-restaurant-id', restaurantId);
      try { localStorage.setItem('tavo:aktives-restaurant', restaurantId); } catch (e) {}

      await loadRestaurant(restaurantId);
    }

    window.addEventListener('tablefy:restaurant-change', function (event) {
      const id = event.detail?.restaurantId || event.detail?.id;
      if (id) setActiveRestaurant(id);
    });

    /* Reagiert auf beide Wege: das Attribut am <html> und das, was
       das Dashboard in [data-res-restaurant] schreibt. */
    new MutationObserver(function (mutations) {
      if (!mutations.some((m) => m.attributeName === 'data-active-restaurant-id')) return;
      const id = getActiveRestaurantId();
      if (id && userHasRestaurant(id)) loadRestaurant(id);
    }).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-active-restaurant-id'],
    });

    document.addEventListener('tavo:hydrated', function () {
      const id = getActiveRestaurantId();
      if (id && userHasRestaurant(id)) loadRestaurant(id);
    });

    window.TablefyDashboardBackground = {
      setRestaurant: setActiveRestaurant,
      refresh: resolveUserRestaurants,
      getRestaurant() { return currentRestaurantId; },
    };

    sb.auth.onAuthStateChange(function (event) {
      if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') resolveUserRestaurants();
      if (event === 'SIGNED_OUT') {
        memberships = [];
        currentRestaurantId = null;
        try { localStorage.removeItem('tavo:aktives-restaurant'); } catch (e) {}
        renderTheme(FALLBACK);
      }
    });

    renderTheme(FALLBACK);
    resolveUserRestaurants();
  })();
</script>
