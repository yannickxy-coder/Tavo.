<style>
/* tavo — Push-Seite: Grundgerüst (Aussehen über die Klassen im Designer) */
[data-res-push]{position:fixed;top:0;right:0;bottom:0;width:100vw;z-index:100;visibility:hidden;transform:translate3d(100%,0,0);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;will-change:transform;overflow-anchor:none}
[data-res-push]::before{content:"";position:absolute;top:0;left:0;width:1px;height:calc(100% + 1px);pointer-events:none}
[data-res-push-overlay]{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none}
html[data-res-push-open][data-res-push-panel] [data-res-push-overlay]{pointer-events:auto}
[data-res-push][data-res-push-mode="panel"]{width:min(460px,100vw);box-shadow:-24px 0 60px rgba(0,0,0,.12)}
/* Initialen-Kreis auf weißer Tagesbox sichtbar machen */
.res-day-box .guest-icon-reservierung-offen{background-color:#f1f1f3}
[data-res-months]{scrollbar-width:none}
[data-res-months]::-webkit-scrollbar{display:none}
[data-res-hero-parts]{display:flex;align-items:flex-start;flex-wrap:nowrap;white-space:nowrap}
[data-res-hero-parts]>*{line-height:1.2em}
/* Push-Liste: echte Zeilenhöhen statt geschätzter (content-visibility), sonst springt das Nachladen */
[data-res-push] [data-res-item]{content-visibility:visible;contain-intrinsic-size:none}
/* Monatsleiste mit gleitender Pille */
[data-res-months]{position:relative}
[data-res-month]{position:relative;z-index:1}
[data-res-month-pill]{position:absolute;left:0;top:0;z-index:0;pointer-events:none;will-change:transform,width}
[data-res-months-pill] [data-res-month].is-on{background-color:transparent!important;color:var(--res-pill-text,inherit)!important}
[data-res-months-pill] [data-res-month]{transition:color .3s ease}
/* Nur im Webflow-Designer: Push-Seite und Vorlagen sichtbar machen */
html.wf-design-mode [data-res-push]{position:relative!important;visibility:visible!important;transform:none!important;inset:auto!important;width:100%!important;height:auto!important;z-index:auto!important;overflow:visible!important}
html.wf-design-mode .res-templates{display:block!important}
html.wf-design-mode [data-res-month-pill]{position:static;display:inline-block;min-width:80px;min-height:36px}
</style>

    var anim = smooth && pill._placed && !reduced();
    pill.style.transition = anim ? ['transform', 'width', 'height'].map(function (p) { return p + ' ' + dur + 'ms ' + ez; }).join(',') : 'none';

    pill.style.height = on.offsetHeight + 'px';

  }
  function jumpMonth(ym) {
    if (!cur) return;
    var L = cur.target, idx = -1;
    for (var i = 0; i < L.matches.length; i++) if (L.matches[i].key.slice(0, 7) === ym) { idx = i; break; }
    if (idx < 0) return;
    if (idx < (L.lo || 0)) prepend(Math.max(0, idx - 5));   // Vergangenheit noch nicht geladen
    if (L.limit > 0 && idx >= L.limit) { L.limit = idx + (L.pageSize || 30); api().kit.reconcile(L); }
    var g = L.host.querySelector('[data-res-group-date^="' + ym + '"]'); if (!g) return;
    var hb = headBottom();
    monthLock = ym; markMonth(ym, true);
    clearTimeout(monthT); monthT = setTimeout(unlockMonth, 900);
    page.scrollTo({ top: page.scrollTop + g.getBoundingClientRect().top - hb - 8, behavior: reduced() ? 'auto' : 'smooth' });
  }
  function unlockMonth() { monthLock = null; heroKey = ''; paintHero(false); }

  /* ── Agenda: ab heute starten, Vergangenes oben nachladen ──── */
  function startsToday() {
    var keys = (page.getAttribute(A + '-start') || 'alle').split(',').map(function (k) { return k.trim(); });
    return !!cur && keys.indexOf(cur.src.key) > -1;
  }
  function todayIndex(L) {
    var k = api().kit, t = k.dayKey(k.wall(Date.now()));
    for (var i = 0; i < L.matches.length; i++) if (L.matches[i].key >= t) return i;
    return Math.max(0, L.matches.length - 1);   // nichts Künftiges: beim letzten Tag
  }
  /* v2.10: Unterkante des (sticky) Kopfs — dort, wo er beim Scrollen klebt. */
  function headBottom() {
    var HEAD_SEL = '[' + A + '-head],[' + A + '-header],[res-push-header],.res-push-header';
    var pr = page.getBoundingClientRect(), b = pr.top + page.clientTop;
    [].forEach.call(page.querySelectorAll(HEAD_SEL), function (h) {
      var cs = getComputedStyle(h), r = h.getBoundingClientRect();
      if (cs.display === 'none') return;
      var v = cs.position === 'sticky' ? pr.top + page.clientTop + (parseFloat(cs.top) || 0) + r.height : r.bottom;

  /* Fenster nach oben erweitern, Blick bleibt stehen. */
  function prepend(newLo) {
    var L = cur.target;
    if (!(L.lo > 0) || newLo >= L.lo) return;
    var ref = L.host.querySelector('[data-res-item]'), before = ref ? ref.getBoundingClientRect().top : 0;
    L.lo = Math.max(0, newLo);

  }
  function anchorToday() {
    if (!startsToday() || !api().kit) return;
    var L = cur.target, i = todayIndex(L), ps = L.pageSize || 30;
    if (i <= 0) return;
    L.lo = Math.max(0, i - ps); L.limit = i + ps;
    api().kit.reconcile(L);
    var g = L.host.querySelector('[data-res-group-date="' + L.matches[i].key + '"]');
    if (g) page.scrollTop = page.scrollTop + g.getBoundingClientRect().top - headBottom() - 8;

  function maybeLoadEarlier() {
    if (!cur || upBusy || !(cur.target.lo > 0) || page.scrollTop > 1200) return;
    upBusy = true;
    prepend(cur.target.lo - (cur.target.pageSize || 30));

  }

  /* ── Bewegung ───────────────────────────────────────────── */
  function pick(sel) {

    return [].filter.call(document.querySelectorAll(sel), function (e) {

  function collect() {
    R = pick(page.getAttribute(A + '-root') || ROOT_DEF);
    H = pick(page.hasAttribute(A + '-hide') ? page.getAttribute(A + '-hide') : HIDE_DEF).filter(function (e) { return R.indexOf(e) < 0; });
  }
  /* Navbar, Pille, Blur: weg statt mitschieben (backdrop-filter ist teuer). */
  function hideLayers(on, instant) {
    H.forEach(function (e) {
      clearTimeout(e._pushT);
      if (on) {
        e.style.transition = 'opacity 160ms ease';
        e.style.opacity = '0';
        e._pushT = setTimeout(function () { e.style.visibility = 'hidden'; }, 170);
      } else if (instant) {
        e.style.transition = ''; e.style.visibility = ''; e.style.opacity = '';
      } else {
        e.style.transition = 'none'; e.style.visibility = ''; e.style.opacity = '0';
        e.offsetWidth;

  function set(p, dur) {
    var t = dur && !reduced() ? 'transform ' + dur + 'ms ' + ease() : 'none';
    page.style.transition = t;
    page.style.transform = 'translate3d(' + ((1 - p) * 100) + '%,0,0)';
    dim.style.transition = t === 'none' ? 'none' : 'opacity ' + dur + 'ms ' + ease();
    dim.style.opacity = String(p * num('dim', 0.35));
    if (panel()) return;
    R.forEach(function (r) {
      r.style.transition = t;
      r.style.transform = 'translate3d(' + (-p * num('shift', 24)) + 'vw,0,0)' + baseOf(r);
    });

    raf = requestAnimationFrame(function () { raf = 0; if (pending != null) set(pending, 0); pending = null; });
  }

    R.forEach(function (r) { r.style.transition = ''; r.style.transform = ''; r.style.willChange = ''; r._pushBase = undefined; });
  }

  /* ── Öffnen / Schließen ─────────────────────────────────── */
  function open(btn) {

    var src = srcFor(btn); if (!src || !api() || !api().switchList) return false;
    var target = lists().filter(function (L) { return L.inSheet && page.contains(L.host); })[0];
    if (!target) { console.warn('[tavo-push] In [data-res-push] fehlt eine Liste mit data-res-sheet-list'); return false; }
    clearTimeout(closeTimer);
    cur = { target: target, src: src, btn: btn };
    api().switchList(target, src.key, src);
    paintHead();
    page.scrollTop = 0;
    monthSig = ''; activeMonth = ''; monthLock = null; buildMonths();
    anchorToday();
    heroKey = ''; heroN = -1; paintHero(true);
    page.style.visibility = 'visible';
    page.removeAttribute('inert'); page.removeAttribute('aria-hidden');

      collect();

      hideLayers(true);
      set(0, 0); page.offsetWidth;
    }
    set(1, num('dur', 640));
    state = 'open';
    if (backPending) { backPending = false; inHistory = true; }   // alter Eintrag noch da
    if (!inHistory) { history.pushState({ tavoPush: 1 }, ''); inHistory = true; }
    document.dispatchEvent(new CustomEvent('tavo:push-open', { detail: { key: src.key } }));
    return true;
  }

  function close(fromHistory, dur, instant) {
    if (state !== 'open') return;
    state = 'closing';
    flushSoon();
    backPending = inHistory && !fromHistory;
    inHistory = false;
    var d = instant ? 0 : (dur || num('out', 520));
    set(0, d);

      var w = page.offsetWidth || innerWidth, a = s.pts[0], z = s.pts[s.pts.length - 1];

  document.addEventListener('click', function (e) {

    var btn = t.closest && t.closest('[data-res-more]');

    var mo = t.closest && t.closest('[data-res-month]');

    var top = sheetOnTop();
    if (top) { Sheet.close(top); history.pushState({ tavoPush: 1 }, ''); inHistory = true; return; }

  document.addEventListener('tavo:ready', function () { init(); paintButtons(); });
  if (history.state && history.state.tavoPush) history.replaceState(null, '');
  if (api()) { init(); paintButtons(); }
  if (page) applyMode();
  window.tavoPush = { open: open, close: function () { close(); }, get state() { return state; } };
})();

<script>
/* tavo — Scrim-Fix: Schließt ein oberes Sheet, rutscht der Scrim sofort
   unter das nächste offene Sheet — das untere wird direkt wieder hell. */
document.addEventListener('sheet:close', function (e) {
  if (!window.Sheet || !Sheet.stack) return;
  var closing = e.detail && e.detail.sheet;
  var rest = Sheet.stack().filter(function (s) { return s !== closing && s.hasAttribute('data-sheet-shown'); });
  if (!rest.length) return;
  var z = parseInt(rest[rest.length - 1].style.zIndex, 10);
  var scrim = document.querySelector('[data-sheet-scrim]');
  if (scrim && z) scrim.style.zIndex = String(z - 1);
});
</script>
